name: Stock Screener

# Runs monthly (1st of each month, 13:00 UTC) and on manual trigger.
on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:
    inputs:
      skip_price:
        description: "Skip yfinance price step (run on fundamentals only)"
        type: boolean
        default: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener (Phase 2)
        env:
          # Set this in: repo Settings -> Secrets and variables -> Actions
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OUTPUT_DIR: output
          TOP_N: "50"
          # Manual runs can flip this on if Yahoo is blocking the runner.
          SKIP_PRICE: ${{ inputs.skip_price && '1' || '' }}
        # NOTE: files live at the repo root in your setup, so call screen.py
        # directly. (If you later move them into a screener/ folder, change
        # this to: python screener/screen.py)
        run: python screen.py

      - name: Commit results
        run: |
          git config user.name  "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add output/
          git commit -m "Monthly screen: $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
